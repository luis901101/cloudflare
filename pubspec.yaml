name: cloudflare
description: This is a dart package for Cloudflare APIs — Images, Stream, Live Inputs, and R2 object storage (S3-compatible).
version: 11.0.0
homepage: https://github.com/luis901101/cloudflare

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  json_annotation: ^4.12.0
  retrofit: ^4.10.0
  http: '>=0.13.4 <2.0.0'
  dio: ^5.11.0
  cross_file: ^0.3.5+4
  path: ^1.9.1
  tusc: ^4.0.0
#    path: ../tusc
  meta: ^1.18.0 # meta is pinned to version 1.18.0 by flutter_test from the flutter SDK.
  adeptannotations: ^7.0.0
  aws_common: ^0.7.15
  aws_signature_v4: ^0.6.13
  xml: ^7.0.1
  http_parser: ^4.1.2
  crypto: ^3.0.7

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.8
  adeptgenerator: ^14.2.0
  build_runner: ^2.15.1 #flutter pub run build_runner build
